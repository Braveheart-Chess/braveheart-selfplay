# One crate at the repository root, so Release Please's `rust` strategy bumps
# this version (and Cargo.lock's) with every release.
[package]
name = "braveheart-selfplay"
version = "0.2.0"
description = "Braveheart's self-play data: datagen, relabel and the datagen audit"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Jimmy Wallace"]
repository = "https://github.com/Braveheart-Chess/braveheart-selfplay"
publish = false

[lib]
name = "braveheart_selfplay"

[[bin]]
name = "datagen"
path = "src/bin/datagen.rs"

[[bin]]
name = "relabel"
path = "src/bin/relabel.rs"

[[bin]]
name = "datagen-audit"
path = "src/bin/datagen_audit.rs"

[dependencies]
# The engine, pinned to one release: datagen plays its search with the net it
# embeds, and relabel scores positions with its search. Every manifest records
# the engine version and commit (build.rs reads them from Cargo.lock), so
# moving this pin is a deliberate change of who generates the data.
braveheart-core = { git = "https://github.com/Braveheart-Chess/braveheart", tag = "v0.54.0" }
braveheart-search = { git = "https://github.com/Braveheart-Chess/braveheart", tag = "v0.54.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
flate2 = "1"
# The text parser and binary writer bullet's `convert --from text` uses; the
# audit runs every sampled record through it.
bulletformat = "=1.8.0"
toml = "1.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

# As the engine's: datagen's speed is the engine's search speed. Local builds
# add `-C target-cpu=native` through `.cargo/config.toml`.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1 # line tables only, so flamegraphs resolve symbols
